name: Manga OCR experiment checks
on:
  push:
    branches:
      - 'experiment/manga-ocr-typeset-v2-20261029'
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow numpy opencv-python-headless
      - run: python -m compileall -q local-server local-trans studio-bridge tests
      - run: python -m unittest discover -s tests -p 'test_*experiment*.py' -v
      - run: python -m unittest discover -s tests -p 'test_*manga*.py' -v
      - run: python -m unittest discover -s tests -p 'test_smart_linebreak.py' -v
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: studio
      - run: npm run build
        working-directory: studio
